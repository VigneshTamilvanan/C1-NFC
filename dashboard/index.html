<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chennai One ETM — Dashboard</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#f0f2f5;color:#222}
  /* Login */
  #loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh}
  .login-card{background:#fff;border-radius:12px;padding:40px 36px;width:340px;box-shadow:0 4px 24px #0002}
  .login-card h1{color:#1A237E;font-size:22px;margin-bottom:4px}
  .login-card p{color:#888;font-size:13px;margin-bottom:28px}
  .login-card input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:14px}
  .login-card button{width:100%;padding:12px;background:#1A237E;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600}
  .login-card button:hover{background:#283593}
  .login-error{color:#c62828;font-size:13px;margin-top:10px;min-height:18px}
  /* Dashboard */
  #dashPage{display:none;min-height:100vh}
  header{background:#1A237E;color:#fff;padding:16px 28px;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:18px}
  header button{background:#ffffff22;border:none;color:#fff;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:13px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:24px 28px 0}
  .stat-card{background:#fff;border-radius:10px;padding:20px 24px;box-shadow:0 1px 6px #0001}
  .stat-card .label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .stat-card .value{font-size:28px;font-weight:700;color:#1A237E}
  .stat-card .sub{font-size:12px;color:#aaa;margin-top:2px}
  .content{padding:24px 28px}
  .table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .table-header h2{font-size:16px;font-weight:600}
  .table-header .refresh{font-size:12px;color:#888}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 6px #0001}
  th{background:#1A237E;color:#fff;padding:11px 14px;text-align:left;font-size:13px;font-weight:500}
  td{padding:11px 14px;font-size:13px;border-bottom:1px solid #f0f0f0}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#f5f7ff}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;background:#e8f5e9;color:#2e7d32}
  .pagination{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .pagination button{padding:6px 14px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:13px}
  .pagination button.active{background:#1A237E;color:#fff;border-color:#1A237E}
  .filter-bar{display:flex;gap:12px;margin-bottom:16px}
  .filter-bar input,.filter-bar select{padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px}
  @media(max-width:768px){.stats{grid-template-columns:1fr 1fr}.content{padding:16px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-card">
    <h1>Chennai One ETM</h1>
    <p>Dashboard Login</p>
    <input type="text" id="loginUser" placeholder="Username" autocomplete="username"/>
    <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password"/>
    <button onclick="doLogin()">Sign In</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashPage">
  <header>
    <h1>Chennai One ETM — Ticket Dashboard</h1>
    <button onclick="doLogout()">Logout</button>
  </header>

  <div class="stats">
    <div class="stat-card">
      <div class="label">Tickets Today</div>
      <div class="value" id="statTodayTickets">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Revenue Today</div>
      <div class="value" id="statTodayRevenue">—</div>
      <div class="sub">₹</div>
    </div>
    <div class="stat-card">
      <div class="label">Total Tickets</div>
      <div class="value" id="statTotalTickets">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Total Revenue</div>
      <div class="value" id="statTotalRevenue">—</div>
      <div class="sub">₹</div>
    </div>
  </div>

  <div class="content">
    <div class="table-header">
      <h2>Recent Tickets</h2>
      <span class="refresh" id="lastRefresh"></span>
    </div>

    <div class="filter-bar">
      <input type="text" id="filterRoute" placeholder="Filter by route..." oninput="filterTable()"/>
      <input type="date" id="filterDate" onchange="filterTable()"/>
      <button onclick="loadData()" style="padding:8px 16px;background:#1A237E;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px">Refresh</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Ticket #</th>
          <th>Route</th>
          <th>Journey</th>
          <th>Fare</th>
          <th>Txn ID</th>
          <th>Time</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="ticketBody"></tbody>
    </table>

    <div class="pagination" id="pagination"></div>
  </div>
</div>

<script>
const API = '';
let token = localStorage.getItem('c1_token');
let allTickets = [];
let currentPage = 1;
const PER_PAGE = 20;

if (token) showDash();

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  document.getElementById('loginError').textContent = '';
  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if (!res.ok) { document.getElementById('loginError').textContent = data.error; return; }
    token = data.token;
    localStorage.setItem('c1_token', token);
    showDash();
  } catch(e) {
    document.getElementById('loginError').textContent = 'Connection error';
  }
}

document.getElementById('loginPass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function doLogout() {
  localStorage.removeItem('c1_token');
  token = null;
  document.getElementById('dashPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
}

function showDash() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('dashPage').style.display = 'block';
  loadData();
  setInterval(loadData, 10000);
}

async function loadData() {
  await Promise.all([loadStats(), loadTickets()]);
  document.getElementById('lastRefresh').textContent =
    'Last updated: ' + new Date().toLocaleTimeString();
}

async function loadStats() {
  try {
    const res = await authFetch('/api/transit/stats');
    if (!res.ok) return;
    const d = await res.json();
    document.getElementById('statTodayTickets').textContent = d.today.tickets;
    document.getElementById('statTodayRevenue').textContent = '₹' + d.today.revenue.toLocaleString('en-IN');
    document.getElementById('statTotalTickets').textContent = d.total.tickets;
    document.getElementById('statTotalRevenue').textContent = '₹' + d.total.revenue.toLocaleString('en-IN');
  } catch(e) {}
}

async function loadTickets() {
  try {
    const res = await authFetch('/api/transit/tickets?limit=500');
    if (!res.ok) { if (res.status === 401) doLogout(); return; }
    const d = await res.json();
    allTickets = d.tickets;
    currentPage = 1;
    filterTable();
  } catch(e) {}
}

function filterTable() {
  const route = document.getElementById('filterRoute').value.toLowerCase();
  const date  = document.getElementById('filterDate').value;

  let filtered = allTickets.filter(t => {
    const matchRoute = !route || (t.route||'').toLowerCase().includes(route);
    const matchDate  = !date  || t.created_at.startsWith(date);
    return matchRoute && matchDate;
  });

  renderTable(filtered);
}

function renderTable(tickets) {
  const total = tickets.length;
  const pages = Math.max(1, Math.ceil(total / PER_PAGE));
  if (currentPage > pages) currentPage = 1;

  const slice = tickets.slice((currentPage-1)*PER_PAGE, currentPage*PER_PAGE);
  const tbody = document.getElementById('ticketBody');
  tbody.innerHTML = slice.map(t => `
    <tr>
      <td><b>${t.ticket_no}</b></td>
      <td>${t.route || '—'}</td>
      <td>${t.source || '—'} → ${t.destination || '—'}</td>
      <td>₹${parseFloat(t.fare).toFixed(2)}</td>
      <td style="font-family:monospace;font-size:11px">${t.txn_id}</td>
      <td>${new Date(t.created_at).toLocaleString('en-IN')}</td>
      <td><span class="badge">${t.status}</span></td>
    </tr>`).join('') || '<tr><td colspan="7" style="text-align:center;color:#aaa;padding:32px">No tickets found</td></tr>';

  const pg = document.getElementById('pagination');
  pg.innerHTML = '';
  for (let i = 1; i <= pages; i++) {
    const btn = document.createElement('button');
    btn.textContent = i;
    if (i === currentPage) btn.classList.add('active');
    btn.onclick = () => { currentPage = i; filterTable(); };
    pg.appendChild(btn);
  }
}

function authFetch(url, opts={}) {
  return fetch(API + url, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type':'application/json', ...(opts.headers||{}) }
  });
}
</script>
</body>
</html>
